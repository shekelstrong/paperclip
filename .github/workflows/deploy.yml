name: Деплой Paperclip RU

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Деплой на сервер
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/paperclip-ru
            git config user.email "privatenedopekin@gmail.com"
            git config user.name "shekelstrong"
            git pull origin master

            echo "=== Установка зависимостей ==="
            pnpm install --no-frozen-lockfile

            echo "=== Сборка UI ==="
            cd ui && npx vite build

            echo "=== Перезапуск ==="
            pkill -f "paperclip" || true
            sleep 2
            cd /opt/paperclip-ru && nohup pnpm dev > server.log 2>&1 &

            sleep 3
            curl -s http://localhost:3101/api/health || true
            echo "✅ Деплой завершён"
