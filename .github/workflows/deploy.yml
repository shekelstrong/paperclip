name: Деплой Paperclip RU

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Деплой на сервер
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/paperclip-ru
            git config user.email "bot@shekelstrong.dev"
            git config user.name "shekelstrong"
            git pull origin master

            echo "=== Установка зависимостей ==="
            pnpm install --no-frozen-lockfile 2>&1 | tail -3

            echo "=== Сборка UI ==="
            cd ui && npx vite build 2>&1 | tail -3
            cd /opt/paperclip-ru

            echo "=== Перезапуск ==="
            # Kill old server only, not the SSH session
            for pid in $(ps aux | grep "pnpm dev" | grep -v grep | awk '{print $2}'); do
              kill "$pid" 2>/dev/null || true
            done
            sleep 3
            cd /opt/paperclip-ru && nohup pnpm dev > /dev/null 2>&1 &
            sleep 4

            echo "=== Проверка ==="
            curl -sf http://localhost:3101/api/health && echo "OK" || echo "WARN"
            echo "DEPLOYED"
