name: Деплой Paperclip RU

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      
      - name: Деплой файлов и перезапуск
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "=== Pull последней версии ==="
            cd /opt/paperclip-ru
            git config user.email "privatenedopekin@gmail.com"
            git config user.name "Nedopekin"
            git pull origin master || true
            
            echo "=== Установка зависимостей ==="
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
            
            echo "=== Проверка типов ==="
            pnpm -r typecheck || echo "⚠️ typecheck failed, continuing"
            
            echo "=== Сборка UI ==="
            cd ui && npx vite build || echo "⚠️ build failed, continuing"
            
            echo "=== Перезапуск Paperclip ==="
            pkill -f "paperclip" || true
            sleep 2
            nohup pnpm dev > /opt/paperclip-ru/server.log 2>&1 &
            
            echo "=== Готово ==="
            sleep 3
            curl -s http://localhost:3101/api/health || echo "Health check pending..."
